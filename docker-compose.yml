services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mafia_online
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      ConnectionStrings__MafiaDb: "Host=db;Port=5432;Database=mafia_online;Username=postgres;Password=password"
      Discord__ClientId: "${DISCORD_CLIENT_ID}"
      Discord__ClientSecret: "${DISCORD_CLIENT_SECRET}"
      Google__ClientId: "${GOOGLE_CLIENT_ID}"
      Google__ClientSecret: "${GOOGLE_CLIENT_SECRET}"
      ASPNETCORE_ENVIRONMENT: Production
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
